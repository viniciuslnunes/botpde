# Espelho automático: Bitbucket main → GitHub main
# Quando Samuel (ou qualquer um) publica no Bitbucket, o tip vai para o GitHub
# e o Railway / Actions disparam. Anti-loop: no-op se o GitHub já tem o tip.
#
# Setup (1×): Repository settings → Pipelines (enable) + variable secured
#   GITHUB_MIRROR_TOKEN = fine-grained PAT (Contents: R/W no viniciuslnunes/botpde)
# Doc: docs/ops/git-remotes.md

image: atlassian/default-image:4

clone:
  depth: full

pipelines:
  branches:
    main:
      - step:
          name: Mirror main → GitHub
          script:
            - |
              set -euo pipefail
              if [ -z "${GITHUB_MIRROR_TOKEN:-}" ]; then
                echo "Missing secured variable GITHUB_MIRROR_TOKEN — see docs/ops/git-remotes.md"
                exit 1
              fi

              git config user.email "mirror@setorize.local"
              git config user.name "setorize-mirror"

              GH_URL="https://x-access-token:${GITHUB_MIRROR_TOKEN}@github.com/viniciuslnunes/botpde.git"
              git remote remove github 2>/dev/null || true
              git remote add github "$GH_URL"

              git fetch github main:refs/remotes/github/main

              LOCAL_SHA="$(git rev-parse HEAD)"
              REMOTE_SHA="$(git rev-parse refs/remotes/github/main)"

              echo "bitbucket HEAD=$LOCAL_SHA"
              echo "github   main=$REMOTE_SHA"

              if [ "$LOCAL_SHA" = "$REMOTE_SHA" ]; then
                echo "Already mirrored — skip (anti-loop)."
                exit 0
              fi

              # Só avança se o tip local for ancestral+ahead (ff). Divergência = falha explícita.
              if git merge-base --is-ancestor "$REMOTE_SHA" "$LOCAL_SHA"; then
                echo "Fast-forward push GitHub main…"
                git push github HEAD:main
                echo "Mirrored $LOCAL_SHA → GitHub (Railway/CI must see this push)."
              else
                echo "Diverged from GitHub — refuse force-push."
                echo "Resolve with pnpm sync:bitbucket locally (fallback), then re-push."
                git log --oneline --left-right --cherry-pick "$REMOTE_SHA"..."$LOCAL_SHA" | head -40
                exit 1
              fi
