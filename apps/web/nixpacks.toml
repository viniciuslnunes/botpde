[phases.build]
cmds = [
  "npm install -g corepack",
  "corepack enable",
  "corepack prepare pnpm@9.15.9 --activate",
  "corepack pnpm install --ignore-scripts",
  "corepack pnpm --filter @torcida/db db:generate",
  "corepack pnpm --filter @torcida/web build"
]

[start]
cmd = "corepack pnpm --filter @torcida/web start"
