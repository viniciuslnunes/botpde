name: Discord — Notificação de Deploy

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # histórico completo para calcular tempo de desenvolvimento

      - name: Enviar notificação ao Discord
        run: |
          HASH_SHORT=$(git log -1 --pretty=%h)
          HASH_FULL=$(git rev-parse HEAD)
          MESSAGE=$(git log -1 --pretty=%s)
          BODY=$(git log -1 --pretty=%b)
          AUTHOR=$(git log -1 --pretty=%an)
          DATE_STR=$(git log -1 --pretty=%cI)
          TOTAL=$(git rev-list --count HEAD)
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          REPO="${{ github.repository }}"

          VERSION=$(node -e "import('./scripts/lib/version-from-git.mjs').then(m => console.log(m.computeVersionFromGit().version))" 2>/dev/null || node -p "require('./package.json').version")
          TAG=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo "")
          VERSION_LABEL="v${VERSION}"
          if [ -n "$TAG" ]; then
            VERSION_LABEL="${TAG}"
          fi

          FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | head -12 | sed 's/^/\`/' | sed 's/$/\`/' | tr '\n' '\n' || echo "(commit inicial)")
          COUNT=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | wc -l | tr -d ' ')
          STATS=$(git diff --shortstat HEAD~1 HEAD 2>/dev/null || echo "")

          COMMIT_URL="https://github.com/${REPO}/commit/${HASH_FULL}"

          FILES_ESCAPED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | head -12 | awk '{print "\`"$0"\`"}' | paste -sd '\n' -)
          [ -z "$FILES_ESCAPED" ] && FILES_ESCAPED="*(commit inicial)*"

          PAYLOAD=$(jq -n \
            --arg msg "$MESSAGE" \
            --arg body "$BODY" \
            --arg author "$AUTHOR" \
            --arg branch "$BRANCH" \
            --arg hash "$HASH_SHORT" \
            --arg url "$COMMIT_URL" \
            --arg files "$FILES_ESCAPED" \
            --arg count "$COUNT" \
            --arg total "$TOTAL" \
            --arg stats "$STATS" \
            --arg date "$DATE_STR" \
            --arg version "$VERSION_LABEL" \
            '{
              embeds: [{
                color: 1,
                title: "🛠️ NOVA ATUALIZAÇÃO — BOT PDE",
                description: (">>> **" + $msg + "**" + (if $body != "" then ("\n\n" + $body) else "" end)),
                fields: [
                  {name: "📦 VERSÃO",                       value: ("`" + $version + "`"), inline: true},
                  {name: "👤 AUTOR",                        value: ("`" + $author + "`"),  inline: true},
                  {name: "🔀 BRANCH",                       value: ("`" + $branch + "`"),  inline: true},
                  {name: "🔢 COMMIT",                       value: ("[`" + $hash + "`](" + $url + ")"), inline: true},
                  {name: ("📁 ARQUIVOS MODIFICADOS — " + $count), value: $files,           inline: false},
                  {name: "📊 TOTAL DE COMMITS",             value: ("`" + $total + "` commits"), inline: true},
                  {name: "± LINHAS",                        value: (if $stats == "" then "—" else ("`" + $stats + "`") end), inline: false}
                ],
                footer: {text: "BOT PDE • Deploy automático via GitHub Actions"},
                timestamp: $date
              }]
            }')

          curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "${{ secrets.DISCORD_WEBHOOK }}"
