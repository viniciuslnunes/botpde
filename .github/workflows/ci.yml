name: CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Typecheck ─────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Instala dependências sem executar scripts de build para ser mais rápido.
      # Roda prisma generate manualmente a seguir (não precisa de DATABASE_URL).
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Pelo pacote, não pelo root: `prisma` é devDependency só de @torcida/db e
      # o node_modules isolado do pnpm não expõe o bin na raiz — `pnpm exec
      # prisma` ali dá "Command not found".
      - name: Gerar Prisma Client
        run: pnpm --filter @torcida/db db:generate

      # `db:generate` regrava src/prisma-exports.js a partir do client recém
      # gerado. Se o commitado divergir, é porque o schema mudou sem regerar —
      # o diff aparece aqui em vez de virar "X is not exported" em runtime.
      # Ver docs/ops/dev-local-performance.md § reexport do Prisma.
      - name: Reexports do Prisma em dia
        run: git diff --exit-code -- packages/db/src/prisma-exports.js

      - name: Typecheck apps/web
        run: pnpm --filter @torcida/web exec tsc --noEmit
        env:
          SKIP_ENV_VALIDATION: true

  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Pelo pacote, não pelo root: `prisma` é devDependency só de @torcida/db e
      # o node_modules isolado do pnpm não expõe o bin na raiz — `pnpm exec
      # prisma` ali dá "Command not found".
      - name: Gerar Prisma Client
        run: pnpm --filter @torcida/db db:generate

      - name: Lint apps/web
        run: pnpm --filter @torcida/web lint
        env:
          SKIP_ENV_VALIDATION: true

      # Responsividade mobile como invariante, não como auditoria pontual.
      # Só análise estática: não precisa de app de pé nem de banco.
      - name: Lint mobile (safe-area + unidades de viewport)
        run: pnpm --filter @torcida/web lint:mobile
