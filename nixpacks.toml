[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
  "npm install -g corepack",
  "corepack enable",
  "corepack prepare pnpm@9.15.9 --activate",
  "corepack pnpm install --prod=false"
]

[phases.build]
cmds = [
  "corepack pnpm --filter @torcida/db exec prisma generate",
  "corepack pnpm --filter @torcida/web build",
  "cp -r apps/web/.next/static apps/web/.next/standalone/.next/static",
  "cp -r apps/web/public apps/web/.next/standalone/public"
]

[start]
cmd = "node apps/web/.next/standalone/server.js"
