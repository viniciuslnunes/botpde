[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
  "npm install -g pnpm@11.9.0",
  "pnpm install --ignore-scripts"
]

[phases.build]
cmds = [
  "pnpm exec prisma generate --schema=packages/db/prisma/schema.prisma",
  "pnpm --filter @torcida/web build"
]

[start]
cmd = "node apps/web/.next/standalone/server.js"
